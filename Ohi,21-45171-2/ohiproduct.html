<!DOCTYPE html>
<html>
<head>
    <title>Eta Product Page</title>
    <link rel="stylesheet" href="malamal_style.css">
</head>

<body>

    <h1 id="mainTitle">আমাদের পণ্য</h1>

    <p class="description">
        আমাদের পণ্য পৃষ্ঠায় স্বাগতম। নীচে আমাদের পণ্যগুলি ব্রাউজ করুন।
    </p>

    <div class="product-container">

        <div class="product-card">
            <h2>স্মার্ট ওয়াচ</h2>
            <p>মূল্য: ৳4000</p>
            <button class="buy-btn">Buy Now</button>
        </div>

        <div class="product-card">
            <h2>হেডফোন</h2>
            <p>মূল্য: ৳300</p>
            <button class="buy-btn">Buy Now</button>
        </div>

    </div>

    <h2>পণ্য টেবিল</h2>

    <table>
        <tr>
            <th>নাম</th>
            <th>মূল্য</th>
        </tr>
        <tr>
            <td>স্মার্ট ওয়াচ</td>
            <td>৳4000</td>
        </tr>
        <tr>
            <td>হেডফোন</td>
            <td>৳300</td>
        </tr>
    </table>

    <h2>অর্ডার করতে যোগাযোগ করুন</h2>

    <input type="text" placeholder="আপনার নাম লিখুন">
    <input type="email" placeholder="আপনার ইমেল লিখুন">
    <button>জমা দিন</button>

</body>
</html>
