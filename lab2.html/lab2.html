<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BANGLADESH YOUTH REVULATION</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <img src="logo.png" class="logo">
  <h1>BANGLADESH YOUTH REVULATION</h1>
  <button id="startBtn" onclick="startGame()">🎮 Start Mission</button>
</header>

<section id="gameSection">
  <div class="stats">
    Score: <span id="score">0</span> | ❤️ Life: <span id="life">3</span> | 🏆 High: <span id="highScore">0</span>
  </div>

  <div id="gameArea">
    <img id="player" src="hero.gif">
    <img id="thief" src="thief.png">
    </div>

  <div class="mobile-controls">
    <button class="ctrl-btn" id="btnLeft">⬅️</button>
    <button class="ctrl-btn" id="btnJump">⬆️ JUMP</button>
    <button class="ctrl-btn" id="btnRight">➡️</button>
  </div>

  <h2 id="gameOverStatus"></h2>
</section>

<script src="my.js"></script>
</body>
</html>
